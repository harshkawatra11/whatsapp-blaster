<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: rgba(24,24,24,0.94);
    border-radius: 10px;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-app-region: no-drag;
    user-select: none;
  }
  #title { color: #25d366; font-weight: bold; font-size: 13px; padding: 6px 10px 2px; }
  #counts { color: #fff; font-size: 13px; padding: 2px 10px; }
  #current { color: #b4b4b4; font-size: 12px; padding: 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { color: #8c8c8c; font-size: 12px; padding: 2px 10px; }
</style>
</head>
<body>
  <div id="title">WhatsApp Blaster</div>
  <div id="counts">Waiting to start...</div>
  <div id="current"></div>
  <div id="status"></div>
  <script>
    // Called from wa/overlay.js via webContents.executeJavaScript — no
    // preload/IPC needed since the main process pushes fully-formed JS
    // calls directly, mirroring the polled-JSON approach the PowerShell
    // overlay used, just without the temp-file round trip.
    window.render = function (evt) {
      if (evt.counts) {
        document.getElementById('counts').textContent =
          'Submitted ' + evt.counts.submitted + '  ·  Failed ' + evt.counts.unknown +
          '  ·  Skipped ' + evt.counts.skipped + '  ·  Left ' + evt.counts.remaining;
      }
      document.getElementById('current').textContent = evt.current ? ('-> ' + evt.current) : '';
      if (evt.status) document.getElementById('status').textContent = evt.status;
      if (evt.done) document.getElementById('status').textContent = 'Run finished.';
    };
  </script>
</body>
</html>
