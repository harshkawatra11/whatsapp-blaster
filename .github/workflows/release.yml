name: Release

# Ordinary commits (docs, fixes) must ship nothing — only a version bump in
# package.json should produce a release, since electron-updater only ever
# updates an install to a HIGHER version number. The "does this version's
# tag already exist" check below is what enforces that: pushing without
# bumping the version is a safe no-op, not an accidental re-release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # --publish never: electron-builder's own GitHub publisher was tried
      # and dropped — confirmed live, it has a race in how it finds-or-
      # creates a release for a brand new tag, which produced TWO separate
      # draft releases for the same version (one got the installer +
      # latest.yml, the other got only the blockmap) with no reliable way
      # to tell which is which afterward. The `release` job below does a
      # single atomic `gh release create` instead, so there's nothing to
      # race.
      - name: Build (no publish)
        run: npx electron-builder --publish never

      # electron-builder's own dist/latest.yml hardcodes a dash-separated
      # asset filename (its convention for the GitHub publisher it expects
      # to run next), but the installer it actually writes to disk keeps
      # spaces in the name. `gh release upload` sanitizes spaces into DOTS,
      # not dashes — confirmed live, that mismatch 404s every real update
      # download. Renaming here to match what latest.yml already expects
      # is simpler than patching the yml.
      - name: Rename installer to match latest.yml's expected filename
        shell: bash
        run: |
          for f in dist/*.exe; do
            mv "$f" "dist/$(basename "$f" | tr ' ' '-')"
          done
          cat dist/latest.yml

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  build-macos:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # No --mac flag needed — package.json's build.mac already declares
      # both arm64 and x64 for dmg + zip. Deliberately never publishes
      # latest-mac.yml: this app is unsigned (no paid Apple Developer ID),
      # so electron-updater's macOS mechanism (Squirrel.Mac) cannot work at
      # all — shipping an update feed that's guaranteed to fail would be
      # worse than shipping none. macOS gets a manual "download the new
      # version" banner instead (see main.js's checkForUpdatesMac).
      - name: Build (no publish)
        run: npx electron-builder --publish never

      # This app has never been proven to actually launch on someone else's
      # Mac (see docs/decisions.md — the Gatekeeper "This software needs to
      # be updated" dialog is the signature of an ad-hoc signature, which is
      # all that's possible without a paid Apple Developer ID). What CAN be
      # verified here is that the signature itself is well-formed —
      # `identity: "-"` producing a malformed/partial signature would fail
      # in a way that's much harder to diagnose from a bug report than from
      # a failed CI step. `--strict` matches what Gatekeeper itself checks.
      - name: Verify ad-hoc code signature
        run: |
          for app in dist/mac*/*.app; do
            echo "=== $app ==="
            codesign --verify --strict --verbose=2 "$app"
            codesign -dvv "$app"
          done

      - name: Rename installers to match Windows' dash convention
        run: |
          for f in dist/*.dmg dist/*.zip; do
            [ -e "$f" ] || continue
            mv "$f" "dist/$(basename "$f" | tr ' ' '-')"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [check, build-windows, build-macos]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.check.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.check.outputs.version }}" \
            --notes "Automated release for v${{ needs.check.outputs.version }}.

          **macOS install:** drag the app into Applications from the .dmg (don't run it from the disk image), then in Terminal:
          \`xattr -dr com.apple.quarantine \"/Applications/WhatsApp Blaster.app\"\`
          This app isn't signed with a paid Apple certificate, so macOS quarantines it on download — the command above clears that flag. Repeat it after every update. Full details: docs/user-guide.md." \
            dist/*.exe dist/latest.yml dist/*.dmg dist/*.zip
