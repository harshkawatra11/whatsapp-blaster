name: Release

# Ordinary commits (docs, fixes) must ship nothing — only a version bump in
# package.json should produce a release, since electron-updater only ever
# updates an install to a HIGHER version number. The "does this version's
# tag already exist" check below is what enforces that: pushing without
# bumping the version is a safe no-op, not an accidental re-release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build and publish
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

      # electron-builder always publishes as a DRAFT — GitHub's API refuses
      # to create a non-draft release directly against a tag that doesn't
      # exist yet, which a fresh version's tag never does. A draft release
      # is invisible to electron-updater (it only looks at published
      # releases), so it has to be un-drafted as a separate step once the
      # tag genuinely exists.
      - name: Publish the release (un-draft)
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" --draft=false
